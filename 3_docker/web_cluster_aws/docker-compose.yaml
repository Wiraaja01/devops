services:
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2

  web1:
    build:
      context: .
      dockerfile: Dockerfile.apache
    volumes:
      - ./html1:/var/www/localhost/htdocs
    mem_limit: 128m

  web2:
    build:
      context: .
      dockerfile: Dockerfile.apache
    volumes:
      - ./html2:/var/www/localhost/htdocs
    mem_limit: 128m
